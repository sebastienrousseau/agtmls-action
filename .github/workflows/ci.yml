name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["20", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  # The action itself, run against this repository. If it cannot audit its own
  # fixtures end to end, the usage in the README is aspirational.
  self-audit:
    name: audit own fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: audit
        uses: ./
        with:
          path: test/fixtures/clean
          fail-on: high
      - uses: github/codeql-action/upload-sarif@4e94bd11f71e507f7f87df81788dff88d1dacbfb # v4
        if: always()
        with:
          sarif_file: ${{ steps.audit.outputs.sarif-file }}
      - name: The deliberately malicious fixture must FAIL
        shell: bash
        run: |
          # A tool that never reports a finding passes every test that only
          # checks it runs. Prove it still fails on known-bad input.
          if node src/run.mjs; then
            echo "::error::the action passed a fixture containing curl|bash"
            exit 1
          fi
          echo "correctly failed on the malicious fixture"
        env:
          INPUT_PATH: test/fixtures/evil
          INPUT_FAIL_ON: high
          INPUT_SARIF_FILE: evil.sarif

  vendor-fresh:
    name: vendored analyzer is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sebastienrousseau/agtmls-spec
          path: .agtmls-spec
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - env:
          AGTMLS_SPEC: ${{ github.workspace }}/.agtmls-spec
        run: node scripts/check-vendor-fresh.mjs
